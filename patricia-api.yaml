components:
  securitySchemes:
    HmacAuth:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-MD5 signature authentication via KrakenD gateway plugin.

        **Signature Scheme:**
        ```
        X-Signature = hex(HMAC-MD5(apiKey + secretKey + timestamp))
        ```

        **Required Headers (POST/PUT/DELETE):**
        - `ChannelId`: Integration channel identifier (e.g., G21)
        - `Api_key`: Public API key
        - `X-Timestamp`: Unix epoch timestamp in seconds
        - `X-Signature`: Hex-encoded HMAC-MD5 signature

        **Required Query Parameters (GET):**
        - `channel_id`: Integration channel identifier
        - `api_key`: Public API key
        - `x_timestamp`: Unix epoch timestamp in seconds
        - `x_signature`: Hex-encoded HMAC-MD5 signature

        **Clock Skew:** 300 seconds (5 minutes)

        **Example (POST):**
        ```bash
        TIMESTAMP=$(date +%s)
        API_KEY="xxxx"
        SECRET_KEY="secret-key-1"
        SIGNATURE=$(echo -n "${API_KEY}${SECRET_KEY}${TIMESTAMP}" | openssl dgst -md5 -hmac "${SECRET_KEY}" -hex | awk '{print $NF}')

        curl -X POST https://api.patricia.io/campaigns/v1/commercial \
          -H "ChannelId: G21" \
          -H "Api_key: ${API_KEY}" \
          -H "X-Timestamp: ${TIMESTAMP}" \
          -H "X-Signature: ${SIGNATURE}" \
          -H "Content-Type: application/json" \
          -d '{"external_campaign_id":"GEN21-CMP-001",...}'
        ```

        **Example (GET):**
        ```bash
        curl "https://api.patricia.io/master/v1/locations/hierarchy?channel_id=G21&api_key=${API_KEY}&x_timestamp=${TIMESTAMP}&x_signature=${SIGNATURE}"
        ```

  schemas:
    GatewayErrorResponse:
      description: Error response from KrakenD gateway (HMAC authentication layer)
      type: object
      properties:
        error:
          type: string
          description: Gateway error message
      example:
        error: invalid signature

    ServiceErrorResponse:
      description: Error response from Patricia service (business logic layer)
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: string
              description: Service-specific error code
            message:
              type: string
              description: Human-readable error description
      example:
        status:
          code: MST40101
          message: Unauthorized

    ErrorResponse:
      description: Generic error response (deprecated, use GatewayErrorResponse or ServiceErrorResponse)
      type: object
      properties:
        error:
          type: string
          description: Error message
      example:
        error: invalid signature

    Location:
      type: object
      properties:
        location_id:
          type: string
          format: uuid
          description: UUID of the location
          example: CITY-001
        name:
          type: string
          description: Name of the location
          example: Bandung
        type:
          type: string
          enum:
            - PROVINCE
            - CITY
          description: Type of location
        timezone:
          type: string
          description: IANA timezone identifier
          example: Asia/Jakarta
        parent_id:
          type: string
          format: uuid
          description: Parent location ID (for hierarchical relationships)
        children:
          type: array
          items:
            $ref: "#/components/schemas/Location"
          description: Child locations (for hierarchy)

    LocationHierarchyResponse:
      type: object
      properties:
        status:
          type: object
          properties:
            code:
              type: string
              example: MST20000
            message:
              type: string
              example: Location hierarchy successfully retrieved
        data:
          type: array
          items:
            $ref: "#/components/schemas/Location"

    LocationListResponse:
