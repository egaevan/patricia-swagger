components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT Bearer token authentication for internal Patricia services.

        **Required Headers:**
        - `Authorization: Bearer <jwt_token>`
        - `X-User-Id`: User UUID (set by auth middleware)
        - `X-Organization-Id`: Organization UUID (set by auth middleware)
    HmacAuth:
      type: apiKey
      in: header
      name: X-Signature
      description: |
        HMAC-MD5 signature authentication via KrakenD gateway plugin.

        **Signature Scheme:**
        ```
        X-Signature = hex(HMAC-MD5(apiKey + secretKey + timestamp))
        ```

        **Required Headers (POST/PUT/DELETE):**
        - `ChannelId`: Integration channel identifier (e.g., G21)
        - `Api_key`: Public API key
        - `X-Timestamp`: Unix epoch timestamp in seconds
        - `X-Signature`: Hex-encoded HMAC-MD5 signature

        **Required Query Parameters (GET):**
        - `channel_id`: Integration channel identifier
        - `api_key`: Public API key
        - `x_timestamp`: Unix epoch timestamp in seconds
        - `x_signature`: Hex-encoded HMAC-MD5 signature

        **Clock Skew:** 300 seconds (5 minutes)
