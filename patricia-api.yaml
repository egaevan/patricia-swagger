openapi: 3.0.3
info:
  title: Patricia API
  description: |
    Patricia Digital Out-of-Home (DOOH) Commercial Inventory Platform API.

    Patricia serves as the operational/device platform and source of truth for:
    - Location master data
    - Device inventory and capabilities
    - Campaign distribution and execution
    - Showtime scheduling
    - Rate card references
    - Slot inventory management
    - Health monitoring

    ## Authentication

    All API requests require HMAC-MD5 signature validation via KrakenD gateway plugin.

    ### Signature Scheme
    ```
    X-Signature = hex(HMAC-MD5(apiKey + secretKey + timestamp))
    ```

    ### Request Format

    #### GET Requests (query parameters)
    ```
    GET /patricia/v1/endpoint?channel_id=G21&api_key=xxxx&x_timestamp=1716307200&x_signature=<hex-hmac>
    ```

    #### POST/PUT/DELETE Requests (headers)
    ```
    POST /patricia/v1/endpoint
    Headers:
      ChannelId: G21
      Api_key: xxxx
      X-Timestamp: 1716307200
      X-Signature: <hex-hmac>
      Content-Type: application/json
      Accept: application/json
    ```

    ### Header/Query Parameter Names

    | Purpose | Header | Query Param |
    |---------|--------|-------------|
    | Channel ID | `ChannelId` | `channel_id` |
    | API Key | `Api_key` | `api_key` |
    | Timestamp | `X-Timestamp` | `x_timestamp` |
    | Signature | `X-Signature` | `x_signature` |

    ### Timestamp Format
    Unix epoch timestamp in seconds (e.g., `1716307200`). Clock skew tolerance: 300 seconds (5 minutes).

    ### Error Responses

    | Scenario | HTTP Status | Response Body |
    |----------|-------------|---------------|
    | Missing required params | 400 | `{"error": "missing channel_id"}` |
    | Credential not found | 401 | `{"error": "invalid credentials"}` |
    | Timestamp expired | 401 | `{"error": "request expired"}` |
    | Signature mismatch | 401 | `{"error": "invalid signature"}` |
    | Endpoint not authorized | 403 | `{"error": "endpoint not authorized"}` |

    ## Timestamp Standard
    All business timestamps use ISO8601 UTC format: `2026-05-12T10:00:00Z`
    Authentication timestamps use Unix epoch: `1716307200`

    ## HTTP Status Convention
    | Status | Meaning |
    |--------|---------|
    | 200 | Success |
    | 202 | Accepted async processing |
    | 400 | Invalid payload |
    | 401 | Unauthorized |
    | 403 | Forbidden |
    | 404 | Resource not found |
    | 409 | Duplicate conflict |
    | 422 | Business validation failed |
    | 500 | Internal server error |
  version: 1.0.0
  contact:
    name: Patricia API Support
  license:
    name: Proprietary

servers:
  - url: https://api.patricia.co.id
    description: Production
  - url: https://api.patricia.kubesnp.salt.id
    description: Staging

tags:
  - name: Master Data
    description: Location hierarchy and master data (Patricia = Source of Truth)
  - name: Organization
    description: Organization synchronization and product industry
  - name: Device
    description: Device inventory, capabilities, and health
  - name: Campaign
    description: Commercial campaign injection and management
  - name: Showtime
    description: Showtime categories, schedules, and slots
  - name: Rate Card
    description: Rate card pricing reference
  - name: Inventory Slot
    description: Slot availability and booking
  - name: Health
    description: System health and operational monitoring

paths:
  /master/v1/locations/hierarchy:
    get:
      tags:
        - Master Data
      summary: Get full location hierarchy
      description: Retrieve the complete location hierarchy from Province to City level.
      operationId: getLocationHierarchy
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationHierarchyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /master/v1/locations:
    get:
      tags:
        - Master Data
      summary: Get flat list of locations
      description: Retrieve a flat list of all locations.
      operationId: getLocations
      security:
        - HmacAuth: []
      parameters:
        - name: type
          in: query
          description: Filter by location type (PROVINCE, CITY)
          schema:
            type: string
            enum:
              - PROVINCE
              - CITY
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /master/v1/locations/{location_id}:
    get:
      tags:
        - Master Data
      summary: Get location details
      description: Retrieve details of a specific location.
      operationId: getLocationById
      security:
        - HmacAuth: []
      parameters:
        - name: location_id
          in: path
          required: true
          description: UUID of the location
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /master/v1/locations/changes:
    get:
      tags:
        - Master Data
      summary: Get incremental location changes
      description: Retrieve incremental sync of location changes since a specific timestamp.
      operationId: getLocationChanges
      security:
        - HmacAuth: []
      parameters:
        - name: updated_after
          in: query
          required: true
          description: ISO8601 timestamp to get changes after
          schema:
            type: string
            format: date-time
            example: "2026-05-12T10:00:00Z"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationChangesResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /master/v1/locations/validate:
    post:
      tags:
        - Master Data
      summary: Validate locations
      description: Validate a list of location IDs before creating a campaign.
      operationId: validateLocations
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LocationValidationRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations/v1/sync:
    post:
      tags:
        - Organization
      summary: Sync organization
      description: Synchronize a new organization from Patricia to consumer systems.
      operationId: syncOrganization
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationSyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations/v1/{organization_id}:
    get:
      tags:
        - Organization
      summary: Get organization details
      description: Retrieve details of a specific organization.
      operationId: getOrganizationById
      security:
        - HmacAuth: []
      parameters:
        - name: organization_id
          in: path
          required: true
          description: UUID of the organization
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /organizations/v1/product-industry:
    get:
      tags:
        - Organization
      summary: Get product industry master
      description: Retrieve the 4-level product industry hierarchy (Industry -> Category -> Sub-Category -> Product).
      operationId: getProductIndustry
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductIndustryResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /devices/v1/sync:
    post:
      tags:
        - Device
      summary: Sync device
      description: Synchronize a new device after pairing is completed.
      operationId: syncDevice
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceSyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /devices/v1/availability:
    get:
      tags:
        - Device
      summary: Get device availability
      description: Retrieve available devices for commercial inventory.
      operationId: getDeviceAvailability
      security:
        - HmacAuth: []
      parameters:
        - name: location_id
          in: query
          description: Filter by location ID
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          description: Filter by organization ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by device status
          schema:
            type: string
            enum:
              - ONLINE
              - OFFLINE
              - ALL
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceAvailabilityResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /devices/v1/health-check:
    post:
      tags:
        - Device
      summary: Bulk device health check
      description: Check online/offline status of multiple devices in bulk.
      operationId: bulkDeviceHealthCheck
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceHealthCheckRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHealthCheckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /devices/v1/capabilities:
    get:
      tags:
        - Device
      summary: Get device capabilities
      description: Retrieve information about device capabilities.
      operationId: getDeviceCapabilities
      security:
        - HmacAuth: []
      parameters:
        - name: device_id
          in: query
          description: Filter by specific device ID
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCapabilitiesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /devices/v1/{device_id}:
    get:
      tags:
        - Device
      summary: Get device details
      description: Retrieve details of a specific device.
      operationId: getDeviceById
      security:
        - HmacAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: ID of the device
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /campaigns/v1/commercial:
    post:
      tags:
        - Campaign
      summary: Create commercial campaign
      description: |
        Inject a commercial campaign from consumer system to Patricia.

        Campaign injection SUCCESS = Patricia accepted request + campaign persisted + MQTT distributed.

        Requires HMAC-MD5 signature validation via KrakenD gateway.
      operationId: createCommercialCampaign
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "202":
          description: Campaign accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /campaigns/v1/commercial/{campaign_id}:
    put:
      tags:
        - Campaign
      summary: Update commercial campaign
      description: Update an existing commercial campaign.
      operationId: updateCommercialCampaign
      security:
        - HmacAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Patricia campaign ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignRequest"
      responses:
        "200":
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /campaigns/v1/commercial/{campaign_id}/cancel:
    post:
      tags:
        - Campaign
      summary: Cancel commercial campaign
      description: Cancel an existing commercial campaign. This is an irreversible action.
      operationId: cancelCommercialCampaign
      security:
        - HmacAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Patricia campaign ID
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for cancellation
                  example: "Client requested cancellation"
      responses:
        "200":
          description: Campaign cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"

  /campaigns/v1/commercial/{campaign_id}/status:
    get:
      tags:
        - Campaign
      summary: Get campaign status
      description: Check the distribution status of a campaign.
      operationId: getCampaignStatus
      security:
        - HmacAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Patricia campaign ID
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /campaigns/v1/commercial/status/bulk:
    post:
      tags:
        - Campaign
      summary: Bulk campaign status check
      description: Check the status of multiple campaigns in bulk.
      operationId: bulkCampaignStatus
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaign_ids
              properties:
                campaign_ids:
                  type: array
                  items:
                    type: string
                  description: List of Patricia campaign IDs
                  example:
                    - PAT-CMP-001
                    - PAT-CMP-002
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCampaignStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /campaigns/v1/replay:
    post:
      tags:
        - Campaign
      summary: Replay failed campaign distribution
      description: Retry distribution of a failed campaign.
      operationId: replayCampaign
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaign_id
              properties:
                campaign_id:
                  type: string
                  description: Patricia campaign ID to replay
      responses:
        "202":
          description: Replay accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  message:
                    type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /showtimes/v1/categories:
    get:
      tags:
        - Showtime
      summary: Get showtime categories
      description: Retrieve all showtime categories.
      operationId: getShowtimeCategories
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimeCategoriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /showtimes/v1/categories/{showtime_id}:
    get:
      tags:
        - Showtime
      summary: Get showtime category details
      description: Retrieve details of a specific showtime category.
      operationId: getShowtimeCategoryById
      security:
        - HmacAuth: []
      parameters:
        - name: showtime_id
          in: path
          required: true
          description: ID of the showtime category
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimeCategoryDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /showtimes/v1/schedules:
    get:
      tags:
        - Showtime
      summary: Get showtime schedules
      description: Retrieve all active showtime schedules.
      operationId: getShowtimeSchedules
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimeSchedulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /showtimes/v1/schedules/active:
    get:
      tags:
        - Showtime
      summary: Get active showtime schedules
      description: Retrieve showtime schedules that are currently active based on current time.
      operationId: getActiveShowtimeSchedules
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimeSchedulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /showtimes/v1/slots:
    get:
      tags:
        - Showtime
      summary: Get slot configuration
      description: "Retrieve showtime slot configuration. Per STO agreement: 1 Slot = 30 seconds."
      operationId: getSlotConfiguration
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rate-cards/v1:
    get:
      tags:
        - Rate Card
      summary: Get all rate cards
      description: Retrieve all rate cards.
      operationId: getRateCards
      security:
        - HmacAuth: []
      parameters:
        - name: active
          in: query
          description: Filter by active status
          schema:
            type: boolean
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rate-cards/v1/{rate_card_id}:
    get:
      tags:
        - Rate Card
      summary: Get rate card details
      description: Retrieve details of a specific rate card.
      operationId: getRateCardById
      security:
        - HmacAuth: []
      parameters:
        - name: rate_card_id
          in: path
          required: true
          description: ID of the rate card
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardDetailResponse"
        "404":
          $ref: "#/components/responses/NotFound"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rate-cards/v1/active:
    get:
      tags:
        - Rate Card
      summary: Get active rate cards
      description: Retrieve all currently active rate cards.
      operationId: getActiveRateCards
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /rate-cards/v1/validate:
    post:
      tags:
        - Rate Card
      summary: Validate rate card
      description: Validate a rate card for campaign pricing. Patricia provides base_price reference only.
      operationId: validateRateCard
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RateCardValidationRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardValidationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /rate-cards/v1/changes:
    get:
      tags:
        - Rate Card
      summary: Get incremental rate card changes
      description: Retrieve incremental sync of rate card changes since a specific timestamp.
      operationId: getRateCardChanges
      security:
        - HmacAuth: []
      parameters:
        - name: updated_after
          in: query
          required: true
          description: ISO8601 timestamp to get changes after
          schema:
            type: string
            format: date-time
