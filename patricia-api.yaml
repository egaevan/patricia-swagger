openapi: 3.0.3
info:
  title: Patricia API
  description: |
    Patricia Digital Out-of-Home (DOOH) Commercial Inventory Platform API.

    ## Updated Scope (2026-05-21)
    - Focus only on Sales Contract and Agency
    - Patricia provides sync endpoints only (no detail endpoints)
    - Gen21 stores synced data locally

    Patricia serves as the operational/device platform and source of truth for:
    - Location master data (sync only)
    - Device inventory (sync only)
    - Campaign distribution and execution
    - Showtime scheduling
    - Rate card references (sync only)
    - Slot inventory management (sync only)
    - Health monitoring
    - Agency management

    ## Authentication

    All API requests require HMAC-MD5 signature validation via KrakenD gateway plugin.

    ### Signature Scheme
    ```
    X-Signature = hex(HMAC-MD5(apiKey + secretKey + timestamp))
    ```

    ### Request Format

    #### GET Requests (query parameters)
    ```
    GET /patricia/v1/endpoint?channel_id=G21&api_key=xxxx&x_timestamp=1716307200&x_signature=<hex-hmac>
    ```

    #### POST/PUT/DELETE Requests (headers)
    ```
    POST /patricia/v1/endpoint
    Headers:
      ChannelId: G21
      Api_key: xxxx
      X-Timestamp: 1716307200
      X-Signature: <hex-hmac>
      Content-Type: application/json
      Accept: application/json
    ```

    ### Header/Query Parameter Names

    | Purpose | Header | Query Param |
    |---------|--------|-------------|
    | Channel ID | `ChannelId` | `channel_id` |
    | API Key | `Api_key` | `api_key` |
    | Timestamp | `X-Timestamp` | `x_timestamp` |
    | Signature | `X-Signature` | `x_signature` |

    ### Timestamp Format
    Unix epoch timestamp in seconds (e.g., `1716307200`). Clock skew tolerance: 300 seconds (5 minutes).

    ### Error Responses

    | Scenario | HTTP Status | Response Body |
    |----------|-------------|---------------|
    | Missing required params | 400 | `{"error": "missing channel_id"}` |
    | Credential not found | 401 | `{"error": "invalid credentials"}` |
    | Timestamp expired | 401 | `{"error": "request expired"}` |
    | Signature mismatch | 401 | `{"error": "invalid signature"}` |
    | Endpoint not authorized | 403 | `{"error": "endpoint not authorized"}` |

    ## Timestamp Standard
    All business timestamps use ISO8601 UTC format: `2026-05-12T10:00:00Z`
    Authentication timestamps use Unix epoch: `1716307200`

    ## HTTP Status Convention
    | Status | Meaning |
    |--------|---------|
    | 200 | Success |
    | 202 | Accepted async processing |
    | 400 | Invalid payload |
    | 401 | Unauthorized |
    | 403 | Forbidden |
    | 404 | Resource not found |
    | 409 | Duplicate conflict |
    | 422 | Business validation failed |
    | 500 | Internal server error |
  version: 1.0.0
  contact:
    name: Patricia API Support
  license:
    name: Proprietary
servers:
  - url: https://api.patricia.co.id
    description: Production
  - url: https://api.patricia.kubesnp.salt.id
    description: Staging
tags:
  - name: Master Data
    description: Location master data sync (Patricia = Source of Truth)
  - name: Organization
    description: Organization sync
  - name: Device
    description: Device inventory sync
  - name: Campaign
    description: Commercial campaign injection and management
  - name: Showtime
    description: Showtime categories, schedules, and slots
  - name: Rate Card
    description: Rate card sync
  - name: Inventory Slot
    description: Inventory slot sync
  - name: Health
    description: System health and operational monitoring
  - name: Agency
    description: Agency management
  - name: Playlist
    description: Playlist management for channel scheduling
paths:
  /master/v1/locations/sync:
    post:
      tags:
        - Master Data
      summary: Sync locations
      description: Sync all locations from Patricia to Gen21. Returns a complete list of locations with full details.
      operationId: syncLocations
      security:
        - HmacAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LocationSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /organizations/v1/sync:
    post:
      tags:
        - Organization
      summary: Sync organizations
      description: Sync all organizations from Patricia to Gen21. Returns a complete list of organizations with full details.
      operationId: syncOrganizations
      security:
        - HmacAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /devices/v1/sync:
    post:
      tags:
        - Device
      summary: Sync devices
      description: Sync all devices from Patricia to Gen21. Returns a complete list of devices with full details including capabilities.
      operationId: syncDevices
      security:
        - HmacAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /rate-cards/v1/sync:
    post:
      tags:
        - Rate Card
      summary: Sync rate cards
      description: Sync all rate cards from Patricia to Gen21. Returns a complete list of rate cards with full details.
      operationId: syncRateCards
      security:
        - HmacAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RateCardSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /inventories/v1/slots/sync:
    post:
      tags:
        - Inventory Slot
      summary: Sync inventory slots
      description: Sync all inventory slots from Patricia to Gen21. Returns a complete list of slots with full details.
      operationId: syncInventorySlots
      security:
        - HmacAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SyncRequest"
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InventorySlotSyncResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /showtimes/v1/categories:
    get:
      tags:
        - Showtime
      summary: Get showtime categories
      description: Retrieve all showtime categories.
      operationId: getShowtimeCategories
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimeCategoriesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /showtimes/v1/schedules:
    get:
      tags:
        - Showtime
      summary: Get showtime schedules
      description: Retrieve all active showtime schedules.
      operationId: getShowtimeSchedules
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShowtimeSchedulesResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /showtimes/v1/slots:
    get:
      tags:
        - Showtime
      summary: Get slot configuration
      description: Retrieve showtime slot configuration. Per STO agreement: 1 Slot = 30 seconds.
      operationId: getShowtimeSlots
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SlotConfigResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /campaigns/v1/commercial:
    post:
      tags:
        - Campaign
      summary: Create commercial campaign
      description: Inject a commercial campaign from Gen21 to Patricia.
      operationId: createCommercialCampaign
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCampaignRequest"
      responses:
        "202":
          description: Campaign accepted for async processing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /campaigns/v1/commercial/{campaign_id}:
    put:
      tags:
        - Campaign
      summary: Update commercial campaign
      description: Update an existing commercial campaign.
      operationId: updateCommercialCampaign
      security:
        - HmacAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Patricia campaign ID
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCampaignRequest"
      responses:
        "200":
          description: Campaign updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"
  /campaigns/v1/commercial/{campaign_id}/cancel:
    post:
      tags:
        - Campaign
      summary: Cancel commercial campaign
      description: Cancel an existing commercial campaign.
      operationId: cancelCommercialCampaign
      security:
        - HmacAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Patricia campaign ID
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  description: Reason for cancellation
      responses:
        "200":
          description: Campaign cancelled successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CancelCampaignResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
  /campaigns/v1/commercial/{campaign_id}/status:
    get:
      tags:
        - Campaign
      summary: Get campaign status
      description: Check the distribution status of a campaign.
      operationId: getCampaignStatus
      security:
        - HmacAuth: []
      parameters:
        - name: campaign_id
          in: path
          required: true
          description: Patricia campaign ID
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /campaigns/v1/commercial/status/bulk:
    post:
      tags:
        - Campaign
      summary: Bulk campaign status check
      description: Check the status of multiple campaigns in bulk.
      operationId: bulkCampaignStatus
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaign_ids
              properties:
                campaign_ids:
                  type: array
                  items:
                    type: string
                  description: List of Patricia campaign IDs
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCampaignStatusResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /campaigns/v1/replay:
    post:
      tags:
        - Campaign
      summary: Replay failed campaign distribution
      description: Retry distribution of a failed campaign.
      operationId: replayCampaign
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - campaign_id
              properties:
                campaign_id:
                  type: string
                  description: Patricia campaign ID to replay
      responses:
        "202":
          description: Replay accepted for processing
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: object
                    properties:
                      code:
                        type: string
                        example: CMP20003
                      message:
                        type: string
                        example: Replay accepted
                  data:
                    type: object
                    properties:
                      campaign_id:
                        type: string
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/v1/integration:
    get:
      tags:
        - Health
      summary: Integration health check
      description: Check Patricia integration health status.
      operationId: getIntegrationHealth
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/v1/mqtt:
    get:
      tags:
        - Health
      summary: MQTT health check
      description: Check MQTT broker connectivity.
      operationId: getMqttHealth
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MqttHealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/v1/devices:
    get:
      tags:
        - Health
      summary: Device health summary
      description: Get summary of device health status.
      operationId: getDeviceHealthSummary
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHealthSummaryResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /health/v1/storage:
    get:
      tags:
        - Health
      summary: Storage health check
      description: Check AWS S3 storage accessibility.
      operationId: getStorageHealth
      security:
        - HmacAuth: []
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StorageHealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"
  /agencies/v1:
    post:
      tags:
        - Agency
      summary: Create new agency
      description: Create a new agency in Patricia system.
      operationId: createAgency
      security:
        - HmacAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgencyRequest"
      responses:
        "201":
          description: Agency created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateAgencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags:
        - Agency
      summary: List all agencies
      description: Retrieve a list of all agencies with optional filtering.
      operationId: listAgencies
      security:
        - HmacAuth: []
      parameters:
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 20
            maximum: 100
        - name: status
          in: query
          description: Filter by status
          schema:
            type: string
            enum:
              - Draft
              - Active
              - Inactive
              - Cancelled
        - name: agency_type
          in: query
          description: Filter by agency type
          schema:
            type: string
            enum:
              - Regular
              - Premium
        - name: search
          in: query
          description: Search by agency name or code
          schema:
            type: string
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgenciesListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /agencies/v1/{agency_id}:
    put:
      tags:
        - Agency
      summary: Update agency details
      description: Update an existing agency's details.
      operationId: updateAgency
      security:
        - HmacAuth: []
      parameters:
        - name: agency_id
          in: path
          required: true
          description: Agency ID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgencyRequest"
      responses:
        "200":
          description: Agency updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateAgencyResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Agency
      summary: Delete agency
      description: Delete an agency from the system.
      operationId: deleteAgency
      security:
        - HmacAuth: []
      parameters:
        - name: agency_id
          in: path
          required: true
          description: Agency ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Agency deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeleteAgencyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
  /playlist:
    post:
      tags:
        - Playlist
      summary: Create playlist
      description: Create a new playlist with video contents for a channel.
      operationId: createPlaylist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePlaylistRequest"
      responses:
        "200":
          description: Playlist created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlaylistResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      tags:
        - Playlist
      summary: Update playlist
      description: Update an existing playlist's details and video contents.
      operationId: updatePlaylist
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlaylistRequest"
      responses:
        "200":
          description: Playlist updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatePlaylistResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Playlist
      summary: Delete playlist
      description: Delete a playlist by ID.
      operationId: deletePlaylist
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Playlist ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Playlist deleted successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeletePlaylistResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    get:
      tags:
        - Playlist
      summary: Get all playlists
      description: Retrieve all playlists with pagination, filtering, and sorting.
      operationId: getAllPlaylists
      security:
        - BearerAuth: []
      parameters:
        - name: channel_id
          in: query
          description: Filter by channel ID
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Filter by status. Supports multiple values (e.g., status[0]=DRAFT&status[1]=APPROVE)
          schema:
            type: array
            items:
              type: string
              enum:
                - DRAFT
                - PENDING_PRODUCTION
                - REJECTED_PRODUCTION
                - PRODUCTION
                - PENDING_BROADCAST_READY
                - REJECTED_BROADCAST_READY
                - BROADCAST_READY
                - APPROVE
                - REJECT
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Items per page
          schema:
            type: integer
            default: 10
        - name: sort_by
          in: query
          description: Sort field
          schema:
            type: string
            enum:
              - playlist_name
              - showtime
              - channel_name
        - name: sort_dir
          in: query
          description: Sort direction
          schema:
            type: string
            enum:
              - asc
              - desc
        - name: search_by
          in: query
          description: Search field
          schema:
            type: string
            enum:
              - playlist_name
        - name: search_value
          in: query
          description: Search keyword
          schema:
            type: string
        - name: from
          in: query
          description: Filter start date (YYYY-MM-DD)
          schema:
            type: string
            format: date
        - name: until
          in: query
          description: Filter end date (YYYY-MM-DD)
          schema:
            type: string
            format: date
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GetAllPlaylistsResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
  /playlist/detail:
    get:
      tags:
        - Playlist
      summary: Get playlist by ID
      description: Retrieve a playlist's full details including video list.
      operationId: findPlaylistById
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: Playlist ID
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Successful response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindPlaylistByIdResponse"
