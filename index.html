<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patricia API - Swagger UI</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5/swagger-ui.css">
  <style>
    html { box-sizing: border-box; overflow: -moz-scrollbars-vertical; overflow-y: scroll; }
    *, *:before, *:after { box-sizing: inherit; }
    body { margin: 0; background: #fafafa; }
    .topbar-wrapper .link::after { content: "v1.0.0"; margin-left: 8px; font-size: 12px; color: #fff; opacity: 0.7; }
    #cors-warning { display: none; background: #fff3cd; border: 1px solid #ffc107; padding: 20px; margin: 40px auto; max-width: 600px; border-radius: 8px; font-family: monospace; }
    .mermaid { display: flex; justify-content: center; padding: 16px 0; }
    .mermaid svg { max-width: 100%; height: auto; }
  </style>
</head>
<body>
  <div id="cors-warning">
    <h3>CORS Restriction Detected</h3>
    <p>Swagger UI cannot load the YAML file via <code>file://</code> protocol.</p>
    <p><strong>Fix:</strong> Serve these files via a local HTTP server:</p>
    <pre>cd "$(dirname "$0")"
python3 -m http.server 8080</pre>
    <p>Then open: <a href="http://localhost:8080">http://localhost:8080</a></p>
  </div>
  <div id="swagger-ui"></div>

  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script src="https://unpkg.com/swagger-ui-dist@5/swagger-ui-standalone-preset.js"></script>
  <script src="https://unpkg.com/mermaid@10/dist/mermaid.min.js"></script>
  <script>
    mermaid.initialize({
      startOnLoad: false,
      theme: 'default',
      securityLevel: 'loose',
      sequence: {
        diagramMarginX: 50,
        diagramMarginY: 10,
        actorMargin: 50,
        width: 150,
        height: 65,
        boxMargin: 10,
        boxTextMargin: 5,
        noteMargin: 10,
        messageMargin: 35,
        mirrorActors: true,
        bottomMarginAdj: 1,
        useMaxWidth: true,
      }
    });

    function renderMermaidDiagrams() {
      const codeBlocks = document.querySelectorAll('pre code.language-mermaid');
      if (codeBlocks.length === 0) return;

      const promises = Array.from(codeBlocks).map(async (block, index) => {
        const id = 'mermaid-' + index;
        block.id = id;
        const graphDefinition = block.textContent;
        const container = document.createElement('div');
        container.className = 'mermaid';
        block.parentNode.replaceWith(container);

        try {
          const { svg } = await mermaid.render(id, graphDefinition);
          container.innerHTML = svg;
        } catch (e) {
          container.innerHTML = '<pre>' + graphDefinition + '</pre>';
        }
      });

      return Promise.all(promises);
    }

    window.onload = function() {
      const isFileProtocol = window.location.protocol === 'file:';
      if (isFileProtocol) {
        document.getElementById('cors-warning').style.display = 'block';
      }

      const ui = SwaggerUIBundle({
        url: isFileProtocol ? '' : './patricia-api.yaml',
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [
          SwaggerUIBundle.presets.apis,
          SwaggerUIStandalonePreset
        ],
        plugins: [
          SwaggerUIBundle.plugins.DownloadUrl
        ],
        layout: "StandaloneLayout",
        validatorUrl: null,
        docExpansion: "list",
        defaultModelsExpandDepth: 3,
        defaultModelExpandDepth: 3,
        displayRequestDuration: true,
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: false,
        supportedSubmitMethods: ["get", "post", "put", "delete", "patch"],
        persistAuthorization: true,
        onComplete: async function() {
          if (isFileProtocol) {
            document.getElementById('swagger-ui').innerHTML = '';
            return;
          }
          await renderMermaidDiagrams();
        },
        onFailure: function(data) {
          if (isFileProtocol) {
            document.getElementById('swagger-ui').innerHTML = '';
          }
        }
      });

      window.ui = ui;

      // Re-render Mermaid diagrams when user expands/collapses endpoints
      const observer = new MutationObserver(() => {
        renderMermaidDiagrams();
      });
      observer.observe(document.getElementById('swagger-ui'), { childList: true, subtree: true });
    };
  </script>
</body>
</html>
