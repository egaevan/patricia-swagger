    const spec = {
  "openapi": "3.0.3",
  "info": {
    "title": "Patricia API",
    "description": "Patricia Digital Out-of-Home (DOOH) Commercial Inventory Platform API.\n\nPatricia serves as the operational/device platform and source of truth for:\n- Location master data\n- Device inventory and capabilities\n- Campaign distribution and execution\n- Showtime scheduling\n- Rate card references\n- Slot inventory management\n- Health monitoring\n\n## Authentication\n\nAll API requests require HMAC-MD5 signature validation via KrakenD gateway plugin.\n\n### Signature Scheme\n```\nX-Signature = hex(HMAC-MD5(apiKey + secretKey + timestamp))\n```\n\n### Request Format\n\n#### GET Requests (query parameters)\n```\nGET /patricia/v1/endpoint?channel_id=G21&api_key=xxxx&x_timestamp=1716307200&x_signature=<hex-hmac>\n```\n\n#### POST/PUT/DELETE Requests (headers)\n```\nPOST /patricia/v1/endpoint\nHeaders:\n  ChannelId: G21\n  Api_key: xxxx\n  X-Timestamp: 1716307200\n  X-Signature: <hex-hmac>\n  Content-Type: application/json\n  Accept: application/json\n```\n\n### Header/Query Parameter Names\n\n| Purpose | Header | Query Param |\n|---------|--------|-------------|\n| Channel ID | `ChannelId` | `channel_id` |\n| API Key | `Api_key` | `api_key` |\n| Timestamp | `X-Timestamp` | `x_timestamp` |\n| Signature | `X-Signature` | `x_signature` |\n\n### Timestamp Format\nUnix epoch timestamp in seconds (e.g., `1716307200`). Clock skew tolerance: 300 seconds (5 minutes).\n\n### Error Responses\n\n| Scenario | HTTP Status | Response Body |\n|----------|-------------|---------------|\n| Missing required params | 400 | `{\"error\": \"missing channel_id\"}` |\n| Credential not found | 401 | `{\"error\": \"invalid credentials\"}` |\n| Timestamp expired | 401 | `{\"error\": \"request expired\"}` |\n| Signature mismatch | 401 | `{\"error\": \"invalid signature\"}` |\n| Endpoint not authorized | 403 | `{\"error\": \"endpoint not authorized\"}` |\n\n## Timestamp Standard\nAll business timestamps use ISO8601 UTC format: `2026-05-12T10:00:00Z`\nAuthentication timestamps use Unix epoch: `1716307200`\n\n## HTTP Status Convention\n| Status | Meaning |\n|--------|---------|\n| 200 | Success |\n| 202 | Accepted async processing |\n| 400 | Invalid payload |\n| 401 | Unauthorized |\n| 403 | Forbidden |\n| 404 | Resource not found |\n| 409 | Duplicate conflict |\n| 422 | Business validation failed |\n| 500 | Internal server error |\n",
    "version": "1.0.0",
    "contact": {
      "name": "Patricia API Support"
    },
    "license": {
      "name": "Proprietary"
    }
  },

    {
      "url": "https://api.patricia.co.id",

      "url": "https://api.patricia.kubesnp.salt.id",

  "paths": {
    "/master/v1/locations/hierarchy": {
      "get": {
        "tags": [
          "Master Data"
        ],
        "summary": "Get full location hierarchy",
        "description": "Retrieve the complete location hierarchy from Province to City level.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as LocationUseCase\n    participant Repo as LocationRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /master/v1/locations/hierarchy\n    API->>UseCase: GetLocationHierarchy()\n    UseCase->>Repo: GetFullHierarchy()\n    Repo->>PostgreSQL: SELECT hierarchical location data\n    PostgreSQL-->>Repo: location hierarchy\n    Repo-->>UseCase: LocationHierarchy\n    UseCase-->>API: LocationHierarchyResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "getLocationHierarchy",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LocationHierarchyResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/master/v1/locations": {
      "get": {
        "tags": [
          "Master Data"

        "summary": "Get flat list of locations",
        "description": "Retrieve a flat list of all locations.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as LocationUseCase\n    participant Repo as LocationRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /master/v1/locations\n    API->>UseCase: GetLocationsList()\n    UseCase->>Repo: GetFlatLocations()\n    Repo->>PostgreSQL: SELECT flat location data\n    PostgreSQL-->>Repo: locations list\n    Repo-->>UseCase: []Location\n    UseCase-->>API: LocationsListResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "getLocations",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "parameters": [
          {
            "name": "type",
            "in": "query",
            "description": "Filter by location type (PROVINCE, CITY)",
            "schema": {
              "type": "string",
              "enum": [
                "PROVINCE",
                "CITY"
              ]
            }
          },
          {
            "name": "page",
            "in": "query",
            "description": "Page number",
            "schema": {
              "type": "integer",
              "default": 1
            }
          },
          {
            "name": "limit",
            "in": "query",
            "description": "Items per page",
            "schema": {
              "type": "integer",
              "default": 50,
              "maximum": 100
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LocationListResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/master/v1/locations/{location_id}": {
      "get": {
        "tags": [
          "Master Data"
        ],
        "summary": "Get location details",
        "description": "Retrieve details of a specific location.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as LocationUseCase\n    participant Repo as LocationRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /master/v1/locations/{location_id}\n    API->>UseCase: GetLocationById(locationId)\n    UseCase->>Repo: FindById(locationId)\n    Repo->>PostgreSQL: SELECT WHERE location_id = ?\n    PostgreSQL-->>Repo: location or null\n    Repo-->>UseCase: Location or nil\n    UseCase->>UseCase: Check if found\n    UseCase-->>API: LocationResponse or Error\n    API-->>Client: 200 OK or 404 Not Found\n```",
        "operationId": "getLocationById",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "parameters": [
          {
            "name": "location_id",
            "in": "path",
            "required": true,
            "description": "UUID of the location",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LocationDetailResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/master/v1/locations/changes": {
      "get": {
        "tags": [
          "Master Data"
        ],
        "summary": "Get incremental location changes",
        "description": "Retrieve incremental sync of location changes since a specific timestamp.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as LocationUseCase\n    participant Repo as LocationRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /master/v1/locations/changes?updated_after=\n    API->>UseCase: GetChangedLocations(updatedAfter)\n    UseCase->>Repo: FindChanges(updatedAfter)\n    Repo->>PostgreSQL: SELECT with timestamp filter\n    PostgreSQL-->>Repo: changed locations\n    Repo-->>UseCase: []LocationChange\n    UseCase-->>API: LocationChangesResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "getLocationChanges",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "parameters": [
          {
            "name": "updated_after",
            "in": "query",
            "required": true,
            "description": "ISO8601 timestamp to get changes after",
            "schema": {
              "type": "string",
              "format": "date-time",
              "example": "2026-05-12T10:00:00Z"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LocationChangesResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/master/v1/locations/validate": {
      "post": {
        "tags": [
          "Master Data"
        ],
        "summary": "Validate locations",
        "description": "Validate a list of location IDs before creating a campaign.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as LocationUseCase\n    participant Repo as LocationRepository\n    participant PostgreSQL as Database\n    Client->>API: POST /master/v1/locations/validate\n    API->>UseCase: ValidateLocations(locationIds)\n    UseCase->>Repo: ValidateIds(locationIds)\n    Repo->>PostgreSQL: SELECT WHERE location_id IN (?)\n    PostgreSQL-->>Repo: existing locations\n    Repo-->>UseCase: validation results\n    UseCase-->>API: LocationValidationResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "validateLocations",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/LocationValidationRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/LocationValidationResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "422": {
            "$ref": "#/components/responses/ValidationError"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/organizations/v1/sync": {

        "tags": [

        "summary": "Sync organization",
        "description": "Synchronize a new organization from Patricia to consumer systems.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as OrganizationUseCase\n    participant Repo as OrganizationRepository\n    participant PostgreSQL as Database\n    Client->>API: POST /organizations/v1/sync\n    API->>UseCase: SyncOrganization(orgData)\n    UseCase->>Repo: CreateOrUpdate(orgData)\n    Repo->>PostgreSQL: INSERT/UPDATE organization\n    PostgreSQL-->>Repo: success/failure\n    Repo-->>UseCase: operation result\n    UseCase-->>API: OrganizationSyncResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "syncOrganization",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/OrganizationSyncRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrganizationSyncResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/organizations/v1/{organization_id}": {
      "get": {
        "tags": [
          "Organization"
        ],
        "summary": "Get organization details",
        "description": "Retrieve details of a specific organization.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as OrganizationUseCase\n    participant Repo as OrganizationRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /organizations/v1/{organization_id}\n    API->>UseCase: GetOrganizationById(orgId)\n    UseCase->>Repo: FindById(orgId)\n    Repo->>PostgreSQL: SELECT WHERE org_id = ?\n    PostgreSQL-->>Repo: organization or null\n    Repo-->>UseCase: Organization or nil\n    UseCase->>UseCase: Check if found\n    UseCase-->>API: OrganizationResponse or Error\n    API-->>Client: 200 OK or 404 Not Found\n```",
        "operationId": "getOrganizationById",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "parameters": [
          {
            "name": "organization_id",
            "in": "path",
            "required": true,
            "description": "UUID of the organization",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/OrganizationDetailResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "404": {
            "$ref": "#/components/responses/NotFound"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/organizations/v1/product-industry": {
      "get": {
        "tags": [
          "Organization"
        ],
        "summary": "Get product industry master",
        "description": "Retrieve the 4-level product industry hierarchy (Industry -> Category -> Sub-Category -> Product).",
        "operationId": "getProductIndustry",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ProductIndustryResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/devices/v1/sync": {
      "post": {
        "tags": [
          "Device"
        ],
        "summary": "Sync device",
        "description": "Synchronize a new device after pairing is completed.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as DeviceUseCase\n    participant Repo as DeviceRepository\n    participant PostgreSQL as Database\n    Client->>API: POST /devices/v1/sync\n    API->>UseCase: SyncDevice(deviceData)\n    UseCase->>Repo: CreateOrUpdate(deviceData)\n    Repo->>PostgreSQL: INSERT/UPDATE device\n    PostgreSQL-->>Repo: success/failure\n    Repo-->>UseCase: operation result\n    UseCase-->>API: DeviceSyncResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "syncDevice",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/DeviceSyncRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeviceSyncResponse"
                }
              }
            }
          },
          "400": {
            "$ref": "#/components/responses/BadRequest"
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "409": {
            "$ref": "#/components/responses/Conflict"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/devices/v1/availability": {
      "get": {
        "tags": [
          "Device"
        ],
        "summary": "Get device availability",
        "description": "Retrieve available devices for commercial inventory.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as DeviceUseCase\n    participant Repo as DeviceRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /devices/v1/availability\n    API->>UseCase: GetDeviceAvailability()\n    UseCase->>Repo: GetAvailabilityStats()\n    Repo->>PostgreSQL: SELECT availability counts\n    PostgreSQL-->>Repo: availability stats\n    Repo-->>UseCase: AvailabilityStats\n    UseCase-->>API: DeviceAvailabilityResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "getDeviceAvailability",
        "security": [
          {
            "HmacAuth": []
          }
        ],
        "parameters": [
          {
            "name": "location_id",
            "in": "query",
            "description": "Filter by location ID",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "organization_id",
            "in": "query",
            "description": "Filter by organization ID",
            "schema": {
              "type": "string",
              "format": "uuid"
            }
          },
          {
            "name": "status",
            "in": "query",
            "description": "Filter by device status",
            "schema": {
              "type": "string",
              "enum": [

                "OFFLINE",
                "ALL"
              ]
            }
          }
        ],
        "responses": {
          "200": {

            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeviceAvailabilityResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },

        "responses": {

    "/devices/v1/capabilities": {

        "tags": [
          "Device"
        ],
        "summary": "Get device capabilities",
        "description": "Retrieve information about device capabilities.\n\n```mermaid\nsequenceDiagram\n    actor Client as Client\n    participant API as API Handler\n    participant UseCase as DeviceUseCase\n    participant Repo as DeviceRepository\n    participant PostgreSQL as Database\n    Client->>API: GET /devices/v1/capabilities\n    API->>UseCase: GetDeviceCapabilities()\n    UseCase->>Repo: GetAllCapabilities()\n    Repo->>PostgreSQL: SELECT all capabilities\n    PostgreSQL-->>Repo: capabilities list\n    Repo-->>UseCase: []Capability\n    UseCase-->>API: CapabilitiesResponse\n    API-->>Client: 200 OK\n```",
        "operationId": "getDeviceCapabilities",
        "security": [

          {

            "schema": {
              "type": "string"

        "responses": {
          "200": {
            "description": "Successful response",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/DeviceCapabilitiesResponse"
                }
              }
            }
          },
          "401": {
            "$ref": "#/components/responses/Unauthorized"
          },
          "500": {
            "$ref": "#/components/responses/InternalError"
          }
        }
      }
    },
    "/devices/v1/{device_id}": {
      "get": {
        "tags": [
          "Device"

  "components": {
    "securitySchemes": {
      "HmacAuth": {
        "type": "apiKey",
        "in": "header",
        "name": "X-Signature",
        "description": "HMAC-MD5 signature authentication via KrakenD gateway plugin.\n\n**Signature Scheme:**\n```\nX-Signature = hex(HMAC-MD5(apiKey + secretKey + timestamp))\n```\n\n**Required Headers (POST/PUT/DELETE):**\n- `ChannelId`: Integration channel identifier (e.g., G21)\n- `Api_key`: Public API key\n- `X-Timestamp`: Unix epoch timestamp in seconds\n- `X-Signature`: Hex-encoded HMAC-MD5 signature\n\n**Required Query Parameters (GET):**\n- `channel_id`: Integration channel identifier\n- `api_key`: Public API key\n- `x_timestamp`: Unix epoch timestamp in seconds\n- `x_signature`: Hex-encoded HMAC-MD5 signature\n\n**Clock Skew:** 300 seconds (5 minutes)\n\n**Example (POST):**\n```bash\nTIMESTAMP=$(date +%s)\nAPI_KEY=\"xxxx\"\nSECRET_KEY=\"secret-key-1\"\nSIGNATURE=$(echo -n \"${API_KEY}${SECRET_KEY}${TIMESTAMP}\" | openssl dgst -md5 -hmac \"${SECRET_KEY}\" -hex | awk '{print $NF}')\n\ncurl -X POST https://api.patricia.io/campaigns/v1/commercial \\\n  -H \"ChannelId: G21\" \\\n  -H \"Api_key: ${API_KEY}\" \\\n  -H \"X-Timestamp: ${TIMESTAMP}\" \\\n  -H \"X-Signature: ${SIGNATURE}\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"external_campaign_id\":\"GEN21-CMP-001\",...}'\n```\n\n**Example (GET):**\n```bash\ncurl \"https://api.patricia.io/master/v1/locations/hierarchy?channel_id=G21&api_key=${API_KEY}&x_timestamp=${TIMESTAMP}&x_signature=${SIGNATURE}\"\n```\n"
      }
    },

    async function renderMermaidDiagrams() {
      const codeBlocks = document.querySelectorAll('pre code.language-mermaid');
      if (codeBlocks.length === 0) return;
      const promises = Array.from(codeBlocks).map(async (block, index) => {
        const id = 'mermaid-' + index;
        block.id = id;
        const graphDefinition = block.textContent;
        const container = document.createElement('div');
        container.className = 'mermaid';
        block.parentNode.replaceWith(container);
        try {
          const { svg } = await mermaid.render(id, graphDefinition);
          container.innerHTML = svg;
        } catch (e) {
          container.innerHTML = '<pre>' + graphDefinition + '</pre>';
        }
      });
      return Promise.all(promises);
    }

    window.onload = function() {
      const ui = SwaggerUIBundle({
        spec: spec,
        dom_id: '#swagger-ui',
        deepLinking: true,
        presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
        plugins: [SwaggerUIBundle.plugins.DownloadUrl],
        layout: 'StandaloneLayout',
        validatorUrl: null,
        docExpansion: 'list',
        defaultModelsExpandDepth: 3,
        defaultModelExpandDepth: 3,
        displayRequestDuration: true,
        filter: true,
        showExtensions: true,
        showCommonExtensions: true,
        tryItOutEnabled: false,
        supportedSubmitMethods: ['get', 'post', 'put', 'delete', 'patch'],
        persistAuthorization: true,
        onComplete: async function() { await renderMermaidDiagrams(); }
      });

      window.ui = ui;
      const observer = new MutationObserver(() => { renderMermaidDiagrams(); });
      observer.observe(document.getElementById('swagger-ui'), { childList: true, subtree: true });
    };
  </script>
</body>
</html>
